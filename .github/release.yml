# Layout of the notes that workflows/release.yml generates with
# `gh release create --generate-notes`. Categories are matched in order and
# `*` only catches what earlier categories did not, so the first one excludes
# Dependabot's `dependencies` label explicitly and those PRs land in the last
# section instead of burying the actual changes. The version bump PR that
# bump.yml opens as github-actions[bot] is pure mechanics, so it is left out.
changelog:
  exclude:
    authors:
      - "github-actions[bot]"
  categories:
    - title: Changes
      labels:
        - "*"
      exclude:
        labels:
          - dependencies
    - title: Dependencies
      labels:
        - dependencies
