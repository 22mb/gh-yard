name: CI

# Lint, format-check, and test on every PR and on pushes to main.
# Keeps the default branch green before a release tag is ever cut (see release.yml).
#
# `--locked` makes cargo fail instead of silently rewriting Cargo.lock when
# Cargo.toml has drifted from it, so only the committed lockfile is ever checked.

on:
  pull_request:
  push:
    branches:
      - main

# Least privilege: grant nothing by default, opt in per job.
permissions: {}

# Cancel superseded runs on the same ref to save runner minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings

  format:
    name: Format check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Format check
        run: cargo fmt --check

  # Tests run on both supported platforms: macOS is the primary one, and the
  # terminal code (/dev/tty, dup2, raw mode) is OS-specific. Each leg is its
  # own status check, so the ruleset's required checks must list both names.
  test:
    name: Test (${{ matrix.name }})
    strategy:
      # Show both results; a failure on one OS must not hide the other's.
      fail-fast: false
      matrix:
        include:
          - name: Linux
            runner: ubuntu-latest
          - name: macOS
            runner: macos-14
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test
        run: cargo test --locked
