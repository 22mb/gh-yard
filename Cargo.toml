[package]
name = "gh-yard"
version = "0.1.0"
edition = "2024"
description = "Pick a repository with fuzzy search and print its path — a gh extension that replaces ghq + fzf"
repository = "https://github.com/22mb/gh-yard"
license = "MIT"

[dependencies]
libc = "0.2.189"
nucleo-matcher = "0.3.1"
ratatui = "0.30.2"
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[dev-dependencies]
tempfile = "3.27.0"
